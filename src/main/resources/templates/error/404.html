<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Página não encontrada')}"></head>
<body>
<header th:replace="~{fragments/common :: nav('')}"></header>
<main class="container content" id="conteudo">
    <section class="notice error-card" aria-labelledby="page-title">
        <div class="error-icon-wrap" aria-hidden="true">
            <span th:replace="~{fragments/icons :: iconGift}"></span>
        </div>
        <span class="badge badge-neutral">Link indisponível · 404</span>
        <h1 id="page-title">Página não encontrada</h1>
        <p class="muted">Este link não está disponível, foi substituído ou o evento foi encerrado. Confira o endereço completo ou peça um novo link a quem organiza o grupo.</p>
        <a class="button" th:href="@{/}">Ir para o início</a>
    </section>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
