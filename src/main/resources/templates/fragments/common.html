<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050914">
    <title th:text="${pageTitle} + ' · Amigo Secreto'">Amigo Secreto</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/gift-32.png}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/gift.svg}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/gift-180.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header" th:fragment="nav(eventName)">
    <div class="container header-content">
        <a class="brand" th:href="@{/}" data-nav-home>
            <img class="brand-icon" th:src="@{/images/gift.svg}" alt="" width="32" height="32">
            <span>Amigo Secreto</span>
        </a>
        <span class="header-event"
              th:if="${eventName != null and !#strings.isEmpty(eventName)}"
              th:text="${eventName}" th:attr="title=${eventName}">Evento</span>
        <nav aria-label="Navegação principal">
            <a th:href="@{/}" data-nav-home>Início</a>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container">
        <p>Organize seu amigo secreto com tranquilidade.</p>
    </div>
</footer>

<input type="hidden" name="_csrf" th:value="${_csrf}" th:fragment="csrf">

<div th:fragment="scripts">
    <div class="sr-only" data-copy-status role="status" aria-live="polite"></div>
    <script th:src="@{/js/app.js}" defer></script>
</div>
</body>
</html>
