<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f6f8" id="meta-theme-color">
    <title th:text="${pageTitle} + ' · Amigo Secreto'">Amigo Secreto</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/gift-32.png}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/gift.svg}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/gift-180.png}">
    <script th:src="@{/js/theme-init.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header" th:fragment="nav(eventName)">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="container header-content">
        <a class="brand" th:href="@{/}" data-nav-home>
            <img class="brand-icon" th:src="@{/images/gift.svg}" alt="" width="32" height="32">
            <span>Amigo Secreto</span>
        </a>
        <div class="header-event"
             th:if="${eventName != null and !#strings.isEmpty(eventName)}"
             th:attr="title=${eventName}">
            <span class="header-event-kicker">Evento</span>
            <span class="header-event-sep" aria-hidden="true"></span>
            <span class="header-event-name" th:text="${eventName}">Evento</span>
        </div>
        <div class="header-actions">
            <nav aria-label="Navegação principal">
                <a class="nav-pill" th:href="@{/}" data-nav-home>
                    <span th:replace="~{fragments/icons :: iconHome}"></span>
                    <span>Início</span>
                </a>
            </nav>
            <button class="theme-toggle" type="button" data-theme-toggle
                    aria-label="Alternar tema claro ou escuro" title="Alternar tema">
                <span class="theme-toggle-icon theme-icon-light" aria-hidden="true">
                    <span th:replace="~{fragments/icons :: iconSun}"></span>
                </span>
                <span class="theme-toggle-icon theme-icon-dark" aria-hidden="true">
                    <span th:replace="~{fragments/icons :: iconMoon}"></span>
                </span>
            </button>
        </div>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container footer-content">
        <p>Organize seu amigo secreto sem cadastro e com sigilo.</p>
        <span class="footer-meta">Acesso seguro por link exclusivo</span>
    </div>
</footer>

<input type="hidden" name="_csrf" th:value="${_csrf}" th:fragment="csrf">

<div th:fragment="scripts">
    <div class="sr-only" data-copy-status role="status" aria-live="polite"></div>
    <div class="toast" id="copy-toast" aria-hidden="true">
        <span th:replace="~{fragments/icons :: iconCheck}"></span>
        <span data-toast-text>Link copiado para a área de transferência</span>
    </div>
    <dialog id="confirm-action-dialog" class="confirm-dialog"
            aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-desc">
        <h2 id="confirm-dialog-title" data-confirm-heading>Confirmar ação</h2>
        <p id="confirm-dialog-desc" data-confirm-body>Deseja continuar com esta operação?</p>
        <div class="dialog-actions">
            <button class="button secondary" type="button" data-confirm-cancel>Cancelar</button>
            <button class="button" type="button" data-confirm-accept>Confirmar</button>
        </div>
    </dialog>
    <script th:src="@{/js/app.js}" defer></script>
</div>
</body>
</html>
