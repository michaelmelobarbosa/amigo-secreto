<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Entrar no amigo secreto')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main class="container content" id="conteudo">
    <section class="notice">
        <p class="eyebrow">Convite para participar</p>
        <h1 th:text="${eventName}">Amigo secreto</h1>
        <p>Preencha seus dados para entrar. Você verá apenas seu resultado pelo link individual.</p>
        <dl class="details">
            <div>
                <dt>Data</dt>
                <dd th:text="${eventDate == null ? 'A definir' : #temporals.format(eventDate, 'dd/MM/yyyy')}">24/12/2026</dd>
            </div>
            <div>
                <dt>Valor sugerido</dt>
                <dd th:text="${suggestedValue == null ? 'Sem valor definido' : #numbers.formatCurrency(suggestedValue)}">R$ 50,00</dd>
            </div>
        </dl>

        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/join/{code}(code=${inviteCode})}" th:object="${form}" method="post">
            <div th:replace="~{fragments/common :: csrf}"></div>
            <div class="field">
                <label for="join-name">Seu nome</label>
                <input id="join-name" type="text" th:field="*{name}" maxlength="80" required autocomplete="name">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro no nome</p>
            </div>
            <div class="field">
                <label for="join-wishlist">O que você gostaria de ganhar? (opcional)</label>
                <textarea id="join-wishlist" th:field="*{wishlist}" maxlength="2000" rows="5"></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('wishlist')}" th:errors="*{wishlist}">Erro na lista</p>
            </div>
            <button class="button" type="submit">Participar</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
