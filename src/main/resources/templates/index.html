<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Criar evento')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main class="container content" id="conteudo">
    <section class="card">
        <h1>Criar amigo secreto</h1>
        <p class="muted">Sem login. Você recebe um link para o painel e outro para participar do sorteio.</p>

        <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>

        <form th:action="@{/events}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/common :: csrf}"></div>

            <div class="field">
                <label for="name">Nome do evento</label>
                <input type="text" id="name" th:field="*{name}" maxlength="80" autocomplete="off" required>
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="field">
                <label for="eventDate">Data do evento <span class="muted">(opcional)</span></label>
                <input type="date" id="eventDate" th:field="*{eventDate}">
                <p class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></p>
            </div>

            <div class="field">
                <label for="suggestedValue">Valor sugerido <span class="muted">(opcional)</span></label>
                <input type="number" id="suggestedValue" th:field="*{suggestedValue}" min="0" step="0.01" inputmode="decimal">
                <p class="field-error" th:if="${#fields.hasErrors('suggestedValue')}" th:errors="*{suggestedValue}"></p>
            </div>

            <div class="field">
                <label for="organizerName">Seu nome (organizador)</label>
                <input type="text" id="organizerName" th:field="*{organizerName}" maxlength="80" autocomplete="name" required>
                <p class="field-error" th:if="${#fields.hasErrors('organizerName')}" th:errors="*{organizerName}"></p>
            </div>

            <button class="button" type="submit">Criar evento</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
