app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    event-create-per-window: ${RATE_LIMIT_EVENT_CREATE:5}
    join-per-window: ${RATE_LIMIT_JOIN:30}
    draw-per-window: ${RATE_LIMIT_DRAW:10}
    wishlist-per-window: ${RATE_LIMIT_WISHLIST:30}
    email-links-per-window: ${RATE_LIMIT_EMAIL_LINKS:10}
    email-resend-per-window: ${RATE_LIMIT_EMAIL_RESEND:20}
    window: ${RATE_LIMIT_WINDOW:PT10M}
    draw-window: ${RATE_LIMIT_DRAW_WINDOW:PT1H}
    email-window: ${RATE_LIMIT_EMAIL_WINDOW:PT1H}
    max-keys: ${RATE_LIMIT_MAX_KEYS:10000}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-email: ${BREVO_FROM_EMAIL:no-reply@mail.barbosalabs.dev}
    from-name: ${BREVO_FROM_NAME:Amigo Secreto}
    reply-to: ${BREVO_REPLY_TO:}
    worker-enabled: ${EMAIL_WORKER_ENABLED:true}
    worker-delay: ${EMAIL_WORKER_DELAY:30000}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sandbox: ${BREVO_SANDBOX:true}

spring:
  application:
    name: amigo-secreto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amigo_secreto}
    username: ${SPRING_DATASOURCE_USERNAME:amigo}
    password: ${SPRING_DATASOURCE_PASSWORD:amigo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      host-header: ""
  servlet:
    session:
      # Sem URL rewriting: o ;jsessionid não aparece em links quando o cliente
      # ainda não aceitou o cookie.
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
