spring:
  datasource:
    url: jdbc:h2:mem:amigosecreto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  base-url: http://localhost:8080
