services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amigo_secreto
      POSTGRES_USER: amigo
      POSTGRES_PASSWORD: amigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigo -d amigo_secreto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
