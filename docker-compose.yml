name: amigo-secreto-dev

# Postgres de desenvolvimento. Este arquivo nunca deve ser usado na VPS:
# ele publica a porta do banco (em loopback) e não tem os limites de produção.
# Use sempre docker-compose.prod.yml no servidor.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amigo_secreto
      POSTGRES_USER: amigo
      POSTGRES_PASSWORD: amigo
    ports:
      # Apenas loopback: outros hosts da rede não alcançam o banco de dev.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigo -d amigo_secreto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
