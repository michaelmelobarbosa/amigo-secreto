name: amigo-secreto

# Produção: dois containers neste projeto (app + Postgres).
# O Caddy é um stack de borda separado (ver docs/INFRA-VPS.md): ele publica
# 80/443, roteia por hostname e alcança esta app por amigo-app:8080 na rede
# externa "edge". Nenhum container deste arquivo publica porta no host.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sem "ports": o banco só é alcançável pelos containers da rede interna.

  app:
    image: ${APP_IMAGE:?defina APP_IMAGE no .env (ex. ghcr.io/usuario/amigo-secreto)}:${APP_TAG:?defina APP_TAG no .env com o SHA da imagem}
    pull_policy: always
    container_name: amigo-app
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BASE_URL: https://${DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_EVENT_CREATE: ${RATE_LIMIT_EVENT_CREATE:-5}
      RATE_LIMIT_JOIN: ${RATE_LIMIT_JOIN:-30}
      RATE_LIMIT_DRAW: ${RATE_LIMIT_DRAW:-10}
      RATE_LIMIT_WISHLIST: ${RATE_LIMIT_WISHLIST:-30}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-PT10M}
      RATE_LIMIT_DRAW_WINDOW: ${RATE_LIMIT_DRAW_WINDOW:-PT1H}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-no-reply@mail.barbosalabs.dev}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Amigo Secreto}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO:-}
      BREVO_SANDBOX: ${BREVO_SANDBOX:-false}
    expose:
      - "8080"
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sem "ports": só o Caddy de borda publica 80/443 e alcança amigo-app:8080.

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  pgdata:
