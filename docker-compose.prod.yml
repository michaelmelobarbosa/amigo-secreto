name: amigo-secreto

# Produção: apenas o Caddy publica portas no host.
# Postgres e aplicação ficam restritos à rede interna do Compose.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    # Sem "ports": o banco só é alcançável pelos containers da rede interna.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: amigo-secreto:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BASE_URL: https://${DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_EVENT_CREATE: ${RATE_LIMIT_EVENT_CREATE:-5}
      RATE_LIMIT_JOIN: ${RATE_LIMIT_JOIN:-30}
      RATE_LIMIT_DRAW: ${RATE_LIMIT_DRAW:-10}
      RATE_LIMIT_WISHLIST: ${RATE_LIMIT_WISHLIST:-30}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-PT10M}
      RATE_LIMIT_DRAW_WINDOW: ${RATE_LIMIT_DRAW_WINDOW:-PT1H}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-no-reply@mail.barbosalabs.dev}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Amigo Secreto}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO:-}
      BREVO_SANDBOX: ${BREVO_SANDBOX:-false}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    # Sem "ports": o app só é alcançável pelo Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
