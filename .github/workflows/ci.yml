name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # No v6 o problem matcher passou a ser opt-in; mantém anotações de compilação no PR.
          problem-matcher: true

      - name: Permissão do wrapper
        run: chmod +x mvnw

      - name: Testes
        run: ./mvnw -B test

      - name: Empacotar
        run: ./mvnw -B -DskipTests package

      - name: Build da imagem Docker
        run: docker build -t amigo-secreto:ci .
